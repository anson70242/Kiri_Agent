<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知 · 切片小助手</title>
<script src="/common.js"></script>
<style>
  :root { /* same 天青 Azure theme as monitor.html */
    --bg: linear-gradient(160deg, #eef5ff 0%, #f3faff 50%, #f5f7ff 100%) fixed;
    --card: #ffffff; --text: #172554; --muted: #5a6b8c; --border: #c7dbf7;
    --accent: #2563eb; --live: #e11d48; --live-bg: #fde2e7; --up: #c2410c; --up-bg: #ffedd5;
    --off: #5a6b8c; --off-bg: #e8effb; --ok: #15803d; --ok-bg: #dcfce7;
    --topbar-bg: rgba(255,255,255,.85); --topbar-text: #1e40af; --topbar-muted: #5a6b8c;
    --topbar-accent: #2563eb; --topbar-border: #c7dbf7;
    --shadow: 0 1px 2px rgba(37,99,235,.06), 0 8px 20px rgba(37,99,235,.10);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--topbar-bg); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--topbar-border); }
  .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 56px;
    display: flex; align-items: center; gap: 28px; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: .2px; color: var(--topbar-text); text-decoration: none; }
  .nav { display: flex; gap: 4px; height: 100%; overflow-x: auto; }
  .nav a { display: flex; align-items: center; padding: 0 12px; color: var(--topbar-muted); text-decoration: none;
    font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .nav a:hover { color: var(--topbar-text); }
  .nav a.active { color: var(--topbar-accent); border-bottom-color: var(--topbar-accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 28px 0 10px; letter-spacing: .3px; }
  .meta { color: var(--muted); font-size: 13px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--live-bg); color: var(--live); }
  .chip.off { background: var(--off-bg); color: var(--off); }
  button, input[type=text] { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--live); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    box-shadow: var(--shadow); min-width: 0; }
  .card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .title { font-weight: 700; font-size: 16px; }
  .card .err { color: var(--live); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }
  .card .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  fieldset.group { border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: var(--shadow);
    padding: 14px 16px; margin: 0 0 12px; min-width: 0; }
  fieldset.group.inactive { opacity: .7; }
  .group .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .group .head label.name { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .group .head input[type=text] { width: 220px; max-width: 100%; }
  .group .id { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
  .opts { margin-top: 10px; }
  .opts .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; white-space: nowrap; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .saved { font-size: 13px; color: var(--ok); }
  .empty { color: var(--muted); padding: 20px; text-align: center; background: var(--card); border: 1px dashed var(--border);
    border-radius: 12px; }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { border-bottom: 1px solid var(--off-bg); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; background: #f6f9ff; white-space: nowrap; }
  td.t { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.fail { color: var(--live); }
</style>
</head>
<body>
<nav class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">切片小助手</a>
    <div class="nav">
      <a href="/">直播状态</a>
      <a href="/archives">录播</a>
      <a href="/highlights">路灯表</a>
      <a href="/notify" class="admin-only active">通知</a>
      <a href="/users" class="admin-only auth-only">用户</a>
    </div>
  </div>
</nav>
<main>
  <h1>通知</h1>
  <div class="cards" id="channels"></div>
  <h2>QQ 群</h2>
  <div id="groups"></div>
  <h2>最近记录</h2>
  <div id="log"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS = { active: ["正常", "ok"], removed: ["已被移出群", "bad"], muted: ["群里关闭了主动发言", "bad"] };
let data = null;
const dirty = new Set();  // groups with unsaved edits: not redrawn by the auto refresh

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : `出错了 (${r.status})`);
  return j;
}

function drawChannels() {
  const q = data.qq, d = data.discord;
  const qq = !q.configured
    ? `<span class="chip off">未设定</span><div class="meta">在服务器 .env 填 QQ_BOT_APP_ID / QQ_BOT_SECRET</div>`
    : `<span class="chip ${q.online ? "ok" : "bad"}">${q.online ? "在线" : "离线"}</span>
       ${q.bot_name ? `<span class="meta">${esc(q.bot_name)}</span>` : ""}
       ${q.last_error && !q.online ? `<div class="err">${esc(q.last_error)}</div>` : ""}`;
  document.getElementById("channels").innerHTML = `
    <div class="card"><div class="top"><span class="title">QQ 机器人</span>${qq}</div></div>
    <div class="card"><div class="top"><span class="title">Discord</span>
      <span class="chip ${d.configured ? "ok" : "off"}">${d.configured ? "已设定" : "未设定"}</span>
      <span class="meta">所有消息都发（含失败提醒）</span></div>
      ${d.configured ? `<div class="actions"><button data-test="discord">发测试消息</button><span class="meta" data-result="discord"></span></div>` : ""}
    </div>`;
}

function groupHtml(g) {
  const [label, cls] = STATUS[g.status] || [g.status, "off"];
  const title = g.name || `未命名群 …${g.openid.slice(-6)}`;
  const checks = (items, chosen, key) => items.map(x =>
    `<label><input type="checkbox" data-${key}="${esc(x.id)}" ${chosen.includes(x.id) ? "checked" : ""}>${esc(x.label || x.name)}</label>`).join("");
  return `<fieldset class="group ${g.enabled && g.status === "active" ? "" : "inactive"}" data-id="${esc(g.openid)}"
      aria-label="QQ 群 ${esc(g.name || g.openid)}">
    <div class="head">
      <label class="name">群名 <input type="text" name="name" value="${esc(g.name)}" placeholder="${esc(title)}"></label>
      <label class="switch"><input type="checkbox" name="enabled" ${g.enabled ? "checked" : ""}>开启通知</label>
      <span class="chip ${g.enabled ? cls : "off"}">${g.enabled ? label : "关闭"}</span>
      <span class="id" title="QQ 给机器人的群 ID">${esc(g.openid)}</span>
    </div>
    <div class="opts"><div class="label">订阅的主播</div>
      <div class="checks">${checks(data.streamers.map(s => ({ ...s, label: s.name })), g.streamers, "streamer") || `<span class="meta">名单里还没有主播</span>`}</div></div>
    <div class="opts"><div class="label">通知类型</div><div class="checks">${checks(data.kinds, g.kinds, "kind")}</div></div>
    <div class="actions">
      <button class="primary" data-save>保存</button>
      <button data-test="${esc(g.openid)}">发测试消息</button>
      <button class="danger" data-delete>删除</button>
      <span class="meta" data-result="${esc(g.openid)}"></span>
    </div>
  </fieldset>`;
}

function drawGroups() {
  const box = document.getElementById("groups");
  if (!data.qq.configured) { box.innerHTML = `<div class="empty">QQ 机器人还没有设定</div>`; return; }
  if (!data.groups.length) {
    box.innerHTML = `<div class="empty">还没有群。把机器人拉进群，或在群里 @机器人，群就会出现在这里。</div>`;
    return;
  }
  for (const g of data.groups) {
    const old = box.querySelector(`fieldset[data-id="${CSS.escape(g.openid)}"]`);
    if (old && dirty.has(g.openid)) continue;
    const tmp = document.createElement("div");
    tmp.innerHTML = groupHtml(g);
    old ? old.replaceWith(tmp.firstElementChild) : box.appendChild(tmp.firstElementChild);
  }
  box.querySelectorAll("fieldset.group").forEach(f => {
    if (!data.groups.some(g => g.openid === f.dataset.id)) f.remove();
  });
  box.querySelector(".empty")?.remove();
}

function drawLog() {
  const names = Object.fromEntries((data.groups || []).map(g => [g.openid, g.name || `…${g.openid.slice(-6)}`]));
  const rows = data.log.map(e => `<tr>
    <td class="t">${esc(new Date(e.at).toLocaleString("zh-CN", { hour12: false }))}</td>
    <td>${e.channel === "qq" ? "QQ" : "Discord"}</td>
    <td>${esc(names[e.target] || e.target)}</td>
    <td>${esc(e.summary)}</td>
    <td class="${e.ok ? "" : "fail"}">${e.ok ? "✅" : "❌ " + esc(e.error)}</td></tr>`).join("");
  document.getElementById("log").innerHTML = rows
    ? `<div class="wrap"><table><thead><tr><th>时间</th><th>渠道</th><th>发给</th><th>内容</th><th>结果</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty">还没有发过消息</div>`;
}

async function load() {
  try { data = await api("GET", "/api/notify"); } catch { return; }
  drawChannels(); drawGroups(); drawLog();
}

document.addEventListener("input", e => {
  const f = e.target.closest("fieldset.group");
  if (f) dirty.add(f.dataset.id);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  const f = b.closest("fieldset.group");
  const key = CSS.escape(b.dataset.test || f?.dataset.id || "");
  const say = (text, ok = true) => {  // looked up each time: a reload redraws the card
    const result = document.querySelector(`[data-result="${key}"]`);
    if (result) { result.textContent = text; result.style.color = ok ? "var(--ok)" : "var(--live)"; }
  };
  try {
    if (b.dataset.test) {
      say("发送中…");
      const r = await api("POST", "/api/notify/test", { target: b.dataset.test });
      say(r.ok ? "已发送 ✅" : `失败：${r.error}`, r.ok);
      await load();
    } else if (b.hasAttribute("data-save")) {
      const pick = key => [...f.querySelectorAll(`[data-${key}]`)].filter(x => x.checked).map(x => x.dataset[key]);
      await api("PATCH", `/api/notify/groups?id=${encodeURIComponent(f.dataset.id)}`, {
        name: f.querySelector("[name=name]").value, enabled: f.querySelector("[name=enabled]").checked,
        streamers: pick("streamer"), kinds: pick("kind") });
      dirty.delete(f.dataset.id);
      await load();
      say("已保存 ✅");
    } else if (b.hasAttribute("data-delete")) {
      const name = f.querySelector("[name=name]").value || f.dataset.id;
      if (!confirm(`删除「${name}」？\n机器人还在群里的话，下次被 @ 时会重新出现。`)) return;
      await api("DELETE", `/api/notify/groups?id=${encodeURIComponent(f.dataset.id)}`);
      dirty.delete(f.dataset.id);
      await load();
    }
  } catch (err) { say(err.message, false); }
});

load();
setInterval(load, 15000);
</script>
</body>
</html>
