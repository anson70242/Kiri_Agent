[project]
name = "kiri-agent"
version = "0.1.0"
description = "Kiri agent and streamer live monitor"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28",
    "openai>=3.49.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
    "yt-dlp[default,deno]>=2026.11.4.232659.dev0",
]

[dependency-groups]
dev = [
    "playwright>=1.65.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: hits real YouTube / Twitch (run with -m network)"]
addopts = "-m 'not network'"
