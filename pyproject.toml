[project]
name = "kiri-agent"
version = "0.1.0"
description = "Kiri agent and streamer live monitor"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28",
    "openai>=3.49.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
    "yt-dlp[default,deno]>=2026.11.4.232659.dev0",
]

[dependency-groups]
dev = [
    "playwright>=1.65.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: hits real YouTube / Twitch / TwitCasting (run with -m network)",
    "slow: takes tens of seconds; skipped by default, CI runs it (-m 'not network' runs everything offline)",
]
addopts = "-m 'not network and not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes: unused imports and names, undefined names, f-strings without placeholders.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported by name and then taken as test arguments.
"tests/*" = ["F811"]
